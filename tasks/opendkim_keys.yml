---
- name: create the domain keys directory
  file:
    path: '{{ dkim_key_dir }}'
    state: directory
    group: '{{ dkim_group }}'
    mode: '0750'

- name: check for the domain signing key
  stat:
    path: '{{ dkim_key_path }}.private'
    get_checksum: false
  register: dkim_key

- name: generate signing key
  command: >-
    opendkim-genkey -b {{ dkim_rsa_keylen }} -s {{ dkim_selector | quote }}
    -d {{ dkim_domain | quote }} -D {{ dkim_key_dir | quote }}
  args:
    creates: '{{ dkim_key_path }}.private'
  when: not dkim_key.stat.exists
  notify: '{{ dkim_config_notify }}'

- name: ensure signing key owner and mode
  file:
    path: '{{ dkim_key_path }}.private'
    owner: '{{ dkim_user }}'
    group: '{{ dkim_group }}'
    mode: '0600'
  when: dkim_key.stat.exists or not ansible_check_mode
