---
## Tasks for Opendkim Ansible role

- name: Validate the DKIM administrator address
  ansible.builtin.assert:
    that:
      - dkim_admin_email is defined
      - dkim_admin_email is string
      - dkim_admin_email | trim | length > 0
    fail_msg: Set dkim_admin_email to the administrator email address.
    quiet: true

- fail:
    msg: "bailing out, this role requires 'dkim_domains' to be defined as a list of domains."
  when:
  - dkim_domains is not defined
  - dkim_domains is not list

- import_tasks: read_key_table.yml

- import_tasks: opendkim.yml

- import_tasks: "{{ dkim_mta }}.yml"

- import_tasks: dns_records.yml

...
