---
- name: opendkim directory present
  ansible.builtin.file:
    path: '{{ dkim_keys_dir }}'
    state: directory
    group: "{{ dkim_group }}"
    mode: '0750'

- name: migrate keys referenced by legacy KeyTable rows
  ansible.builtin.include_tasks: migrate_legacy_key.yml
  loop: '{{ dkim_legacy_keys }}'
  loop_control:
    loop_var: dkim_legacy_key
  vars:
    dkim_migration_key_dir: '{{ dkim_keys_dir }}/{{ dkim_legacy_key.domain }}'

- name: prepare opendkim keys
  ansible.builtin.include_tasks: opendkim_keys.yml
  loop: '{{ dkim_domains }}'
  loop_control:
    loop_var: dkim_domain

- name: opendkim TrustedHosts present
  ansible.builtin.template:
    src: TrustedHosts.j2
    dest: '{{ dkim_opendkim_config_dir }}/TrustedHosts'
  notify: '{{ dkim_config_notify }}'

- name: deploy the OpenDKIM configuration and tables
  vars:
    dkim_previous_tables:
      - path: '{{ dkim_key_table_path }}'
        content: '{{ dkim_key_table_content }}'
        existed: '{{ dkim_key_table_file.stat.exists }}'
        changed: '{{ dkim_key_table_write.changed | default(false) }}'
      - path: '{{ dkim_signing_table_path }}'
        content: '{{ dkim_signing_table_content }}'
        existed: '{{ dkim_signing_table_file.stat.exists }}'
        changed: '{{ dkim_signing_table_write.changed | default(false) }}'
  block:
    - name: configure the OpenDKIM SigningTable
      ansible.builtin.template:
        src: SigningTable.j2
        dest: '{{ dkim_signing_table_path }}'
      register: dkim_signing_table_write
      notify: '{{ dkim_config_notify }}'

    - name: configure the OpenDKIM KeyTable
      ansible.builtin.template:
        src: KeyTable.j2
        dest: '{{ dkim_key_table_path }}'
      register: dkim_key_table_write
      notify: '{{ dkim_config_notify }}'

    - name: configure and validate opendkim.conf
      ansible.builtin.template:
        src: opendkim.conf.j2
        dest: /etc/opendkim.conf
        validate: opendkim -n -x %s
      register: dkim_config_write
      notify: '{{ dkim_config_notify }}'

    - name: validate the installed configuration after updating the tables
      ansible.builtin.command: opendkim -n -x /etc/opendkim.conf
      changed_when: false
      when: not ansible_check_mode and not dkim_config_write.changed

    - name: restart OpenDKIM before removing retired keys
      ansible.builtin.service:
        name: opendkim
        state: restarted
      when: dkim_restart_before_key_cleanup and not ansible_check_mode

    - name: opendkim is running
      ansible.builtin.service:
        name: opendkim
        state: started
        enabled: true
  rescue:
    - name: restore the previous OpenDKIM tables after failed deployment
      ansible.builtin.copy:
        content: '{{ item.content }}'
        dest: '{{ item.path }}'
      loop: '{{ dkim_previous_tables }}'
      loop_control:
        label: '{{ item.path }}'
      when: item.changed and item.existed

    - name: remove newly created OpenDKIM tables after failed deployment
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      loop: '{{ dkim_previous_tables }}'
      loop_control:
        label: '{{ item.path }}'
      when: item.changed and not item.existed

    - name: report the OpenDKIM deployment failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.stderr | default('', true) | trim or ansible_failed_result.msg | default('Cannot deploy the OpenDKIM configuration') }}"

- name: read the installed KeyTable
  ansible.builtin.slurp:
    src: '{{ dkim_key_table_path }}'
  register: dkim_installed_key_table
  when: not ansible_check_mode

- name: remove the migrated legacy key pairs
  ansible.builtin.file:
    path: '{{ dkim_keys_dir }}/{{ item.0 }}.{{ item.1 }}'
    state: absent
  loop: "{{ (dkim_legacy_keys | map(attribute='selector') | unique(case_sensitive=true) | list) | product(['txt', 'private']) | list }}"
  when: (dkim_keys_dir ~ '/' ~ item.0 ~ '.private') not in dkim_referenced_keys

- name: remove keys belonging to unlisted domains
  ansible.builtin.include_tasks: delete_unknown_keys.yml
  when: dkim_delete_unknown | bool

...
