---
## Show the DNS records to configure with the DKIM public key

- name: check whether the DNS record is available in check mode
  stat:
    path: '{{ dkim_key_path }}.txt'
    get_checksum: false
  register: dkim_dns_record_file
  when: ansible_check_mode

- name: extract DKIM public key DNS record
  slurp:
    src: '{{ dkim_key_path }}.txt'
  register: dkim_dns_record
  when: not ansible_check_mode or dkim_dns_record_file.stat.exists

- name: display DKIM public key DNS record
  debug:
    msg:
      - "################################################################################################"
      - "DNS record to add for zone {{ dkim_domain }}:"
      - "{{ dkim_dns_record.content | string | b64decode }}"
      - "################################################################################################"
  when: dkim_dns_record is not skipped

...
