---
# DKIM ANsible role vars

dkim_opendkim_packages:
  - opendkim
  - opendkim-tools
  - openssl

dkim_keys_dir: "{{ dkim_opendkim_config_dir }}/keys"
dkim_key_dir: "{{ dkim_keys_dir }}/{{ dkim_domain }}"
dkim_key_path: "{{ dkim_key_dir }}/{{ dkim_selector }}"
dkim_key_table_path: "{{ dkim_opendkim_config_dir }}/KeyTable"
dkim_signing_table_path: "{{ dkim_opendkim_config_dir }}/SigningTable"
dkim_listed_domains: "{{ dkim_domains | map('lower') | list }}"
dkim_restart_before_key_cleanup: "{{ (dkim_legacy_keys | length > 0) or (dkim_removed_key_table_rows | length > 0) }}"
dkim_config_notify: "{{ [] if dkim_restart_before_key_cleanup else ['restart opendkim'] }}"
dkim_key_table_row_pattern: >-
  (?m)^([ \t]*[^#\s]+[ \t]+([^:\s]+):[^:\s]+:([^:#\r\n]+?)(?::[^#\s]+)?[ \t]*(?:#[^\r\n]*)?)\r?$
dkim_legacy_key_table_pattern: >-
  (?m)^([ \t]*[^#\s]+[ \t]+([a-zA-Z0-9_][a-zA-Z0-9_.-]*):([a-zA-Z0-9_][a-zA-Z0-9_.-]*):({{ dkim_keys_dir | regex_escape }}/\3\.private)[ \t]*(?:#[^\r\n]*)?)\r?$
dkim_configured_key_table: >-
  {{ lookup('ansible.builtin.template', 'KeyTable.j2') if ansible_check_mode
     else dkim_installed_key_table.content | b64decode }}
dkim_referenced_keys: >-
  {{ dkim_configured_key_table | regex_findall(dkim_key_table_row_pattern)
     | map(attribute=2) | map('trim') | list }}

dkim_postfix_config_default: 
- parameter: milter_protocol
  value: 6
- parameter: milter_default_action
  value: accept
- parameter: smtpd_milters
  value: 'inet:localhost:{{ dkim_milter_port }}'
- parameter: non_smtpd_milters
  value: 'inet:localhost:{{ dkim_milter_port }}'

...
